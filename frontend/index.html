<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CivicTech — report, track and resolve local civic issues together." />
    <meta name="theme-color" content="#0e0c08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbf8ef" media="(prefers-color-scheme: light)" />
    <title>CivicTech — Report. Track. Resolve.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One family, site-wide: Barlow Condensed.

      Display headlines, body copy, labels, controls and figures are all the
      same voice; role is carried by weight, size and tracking rather than by
      a second family. This is a deliberate departure from the reference's
      serif-over-grotesque pairing. Tabular numerals keep figures in columns,
      and the face's narrow advance means the scale runs one step larger than
      a grotesque at the same size. See design.md §4.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Paint the correct theme before the first frame so there is no flash, and
      flag motion availability. `.motion` is what arms every animation's
      "before" state in CSS, so if JS is off — or the visitor asked for reduced
      motion — the page renders fully visible and static instead.

      The default is the reference's warm cream paper; dark is the opt-in.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          root.classList.toggle('dark', theme === 'dark');
          root.style.backgroundColor = theme === 'dark' ? '#0e0c08' : '#fbf8ef';
        } catch (e) {
          root.classList.remove('dark');
        }
        try {
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          root.classList.toggle('motion', !reduced);
        } catch (e) {
          /* no matchMedia: leave motion off */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
